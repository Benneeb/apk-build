name: Build custom gEmuera APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-apk.yml"
      - "patches/**"
      - "tools/**"
      - "engine-overrides/**"

permissions:
  contents: read

env:
  GEMUERA_REPO: https://github.com/wwwXiaoHan17/gEmuera.git
  GEMUERA_COMMIT: ff3ce7e090f33c8f935878765e345e9cf1b8904c
  GODOT_VERSION: "4.7-stable"

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout build workspace
        uses: actions/checkout@v4

      - name: Checkout pinned gEmuera and apply optimization
        run: |
          git clone --filter=blob:none "$GEMUERA_REPO" engine
          cd engine
          git checkout "$GEMUERA_COMMIT"
          python ../tools/apply_patch.py .
          git diff --check
          git status --short

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET 8 and 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install .NET Android workload
        run: |
          dotnet workload install android

      - name: Install Godot 4.7 .NET editor
        run: |
          curl -L --fail --retry 3             "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v4.7-stable_mono_linux_x86_64.zip"             -o /tmp/godot.zip
          mkdir -p "$HOME/godot"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          GODOT_BIN="$(find "$HOME/godot" -type f -name 'Godot_v4.7-stable_mono_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          sudo ln -sf "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Install Godot 4.7 .NET export templates
        run: |
          curl -L --fail --retry 3             "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v4.7-stable_mono_export_templates.tpz"             -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.stable.mono"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      - name: Restore and compile Android C#
        working-directory: engine
        run: |
          cat > global.json <<'EOF'
          {
            "sdk": {
              "version": "9.0.318",
              "rollForward": "latestPatch"
            }
          }
          EOF
          dotnet --version
          dotnet restore "gemuera-c#.csproj" -p:GodotTargetPlatform=android
          dotnet build "gemuera-c#.csproj" -c Debug -p:GodotTargetPlatform=android --no-restore

      - name: Inspect native outputs
        working-directory: engine
        run: |
          find . -type f \( -name 'libe_sqlite3.so' -o -name 'libSkiaSharp.so' \) -print || true

      - name: Import Godot project
        working-directory: engine
        run: |
          timeout 120 godot --headless --editor --path . --quit-after 3 || true

      - name: Export installable arm64 APK
        working-directory: engine
        run: |
          mkdir -p build
          set +e
          godot --headless --path . --export-debug Android build/gEmuera-eraTWKR-startup-opt-arm64.apk
          GODOT_EXIT=$?
          set -e

          APK="build/gEmuera-eraTWKR-startup-opt-arm64.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "::warning::Godot exited with code $GODOT_EXIT after producing a verified APK; accepting artifact."
          fi

          sha256sum "$APK" | tee build/SHA256SUMS.txt
          ls -lh build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gEmuera-eraTWKR-startup-opt-arm64
          path: |
            engine/build/gEmuera-eraTWKR-startup-opt-arm64.apk
            engine/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
